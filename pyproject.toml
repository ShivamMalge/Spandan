[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "spandan"
version = "0.1.0"
description = "Defense-only streaming fraud-spike detector for card-testing and velocity abuse."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
spandan = "spandan.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Phase C learned baselines (spandan.eval.baselines) only. Never imported by
    # the detector, the harness, or anything the runtime path touches. Pinned:
    # the boosted model fits differently under 1.8.0 and 1.9.0 on identical
    # inputs (BUILD_LOG, 2026-09-03, entry 15), and section 9 quotes one run.
    "scikit-learn==1.9.0",
    # `make setup` runs `maturin develop --release` after this install; without
    # maturin here it resolves only if one happens to be on PATH globally.
    "maturin>=1.14,<2.0",
]

[tool.maturin]
manifest-path = "spandan-core/Cargo.toml"
python-source = "python"
module-name = "spandan_core._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
