name: ci

# A runner with no global tooling is the machine the fresh-clone criterion
# approximates by hand. Two defects in BUILD_LOG (entries nine and eleven)
# were things only a clean environment could catch: a globally installed
# pytest plugin masking an import-order bug, and a maturin that resolved
# only because one happened to be on PATH. These jobs are that environment.
#
# Two jobs, in parallel:
#   test     - everything that guards a claim: parity, the generator's
#              properties, the LLM boundary, the triage topology, clippy.
#   figures  - `make data`, `make eval`, `make baselines`, `make check`: regenerates the stream
#              and the evaluation from nothing on Linux and fails if any figure
#              a document asserts no longer reproduces. This is the README's
#              "reproduces from make eval on a fresh clone" as a machine check
#              rather than a sentence.
#   experiment - `make data`, `make experiment`, then the checker's EXPERIMENT
#              pass alone: the Phase E long-horizon figures in FAILURE_MODES
#              section 7, regenerated on Linux.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: make setup
        run: |
          python -m venv .venv
          . .venv/bin/activate
          make setup

      - name: lint
        run: |
          . .venv/bin/activate
          # Pinned to the version the tree was linted against. ruff 0.16 turned on
          # rules 0.15 did not, and a linter that moves under a frozen detector
          # would fail on files the freeze forbids touching.
          python -m pip install -q ruff==0.15.21
          ruff check python/ tests/ scripts/

      - name: clippy
        run: cargo clippy --manifest-path spandan-core/Cargo.toml --release -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path spandan-core/Cargo.toml --release

      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        # Job logs are not readable through the API without admin rights;
        # annotations are. On failure every FAILED/ERROR summary line is
        # re-emitted as an annotation so the failing tests are visible there.
        run: |
          . .venv/bin/activate
          set -o pipefail
          if ! pytest -q -rfE 2>&1 | tee pytest.log; then
            grep -E "^(FAILED|ERROR) " pytest.log | sed "s/^/::error::/"
            tail -n 1 pytest.log | sed "s/^/::notice::/"
            exit 1
          fi

      - name: the graph compiles and renders from its declaration
        run: |
          . .venv/bin/activate
          spandan triage-graph
          spandan triage-graph --mermaid | grep -c "explain --> ground"

  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: make setup
        run: |
          python -m venv .venv
          . .venv/bin/activate
          make setup

      - name: make data
        run: |
          . .venv/bin/activate
          make data

      - name: make eval
        env:
          PYTHONIOENCODING: utf-8
        run: |
          . .venv/bin/activate
          make eval

      - name: make baselines
        env:
          PYTHONIOENCODING: utf-8
        run: |
          . .venv/bin/activate
          make baselines

      - name: make check
        env:
          PYTHONIOENCODING: utf-8
        # The checker's failure lines are re-emitted as annotations, which the
        # API exposes without admin rights; job logs are not.
        run: |
          . .venv/bin/activate
          set -o pipefail
          if ! python scripts/check_figures.py --skip experiment 2>&1 | tee check.log; then
            grep -E "^  - " check.log | sed "s/^  - /::error::/"
            exit 1
          fi

  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: make setup
        run: |
          python -m venv .venv
          . .venv/bin/activate
          make setup

      - name: make data
        run: |
          . .venv/bin/activate
          make data

      - name: make experiment
        env:
          PYTHONIOENCODING: utf-8
        run: |
          . .venv/bin/activate
          make experiment

      - name: check the experiment figures
        env:
          PYTHONIOENCODING: utf-8
        run: |
          . .venv/bin/activate
          set -o pipefail
          if ! python scripts/check_figures.py --only experiment 2>&1 | tee check.log; then
            grep -E "^  - " check.log | sed "s/^  - /::error::/"
            exit 1
          fi
